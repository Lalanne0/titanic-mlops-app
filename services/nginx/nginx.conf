events {
    worker_connections 1024;
}

http {
    # ── Logging ───────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── Redirect HTTP → HTTPS ─────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ──────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Increase timeouts for long-running ML operations
        proxy_read_timeout  300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout  300s;

        # ── FastAPI Prediction Service ────────────────
        # /api/health  → http://api:8000/health
        # /api/predict → http://api:8000/predict
        location /api/ {
            proxy_pass http://api:8000/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Evidently Monitoring Dashboard ────────────
        # /monitoring/         → list reports
        # /monitoring/report/… → view report HTML
        location /monitoring/ {
            proxy_pass http://monitoring:8080/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Root redirect → Swagger UI ────────────────
        location = / {
            return 302 /api/docs;
        }
    }
}
