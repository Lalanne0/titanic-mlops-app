# LESSON POINT: Docker Compose Service Dependencies and Health Checks
# By using depends_on with healthcheck condition checks, Docker Compose handles the startup
# order of our microservices. For example, MLflow starts only after PostgreSQL is healthy
# and MinIO bucket initialization is completed. The FastAPI API starts only after MLflow is ready.
# This prevents race conditions where services crash because their database or storage backends
# are not ready yet.

services:

  # --- PostgreSQL (MLflow metadata store) ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - titanic-net

  # --- MinIO (S3-compatible artifact store) ---
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - titanic-net

  # --- MinIO bucket init (runs once, then exits) ---
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/$${MLFLOW_BUCKET_NAME} --ignore-existing;
      echo 'Bucket ready!';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MLFLOW_BUCKET_NAME: ${MLFLOW_BUCKET_NAME}
    networks:
      - titanic-net

  # --- MLflow Tracking Server ---
  mlflow:
    build:
      context: .
      dockerfile: services/mlflow/Dockerfile
    environment:
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MLFLOW_ALLOWED_HOSTS: "*"
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - titanic-net

  # --- FastAPI Prediction Service ---
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MODEL_NAME: ${MODEL_NAME}
      DATA_PATH: ${DATA_PATH}
      MODEL_PATH: ${MODEL_PATH}
      REPORTS_PATH: ${REPORTS_PATH}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.8-27b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
    volumes:
      - model-data:/app/data
      - reports-data:/app/reports
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - titanic-net

  # --- Evidently Monitoring Dashboard ---
  monitoring:
    build:
      context: .
      dockerfile: services/monitoring/Dockerfile
    environment:
      REPORTS_PATH: ${REPORTS_PATH}
    volumes:
      - reports-data:/app/reports
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - titanic-net

  # --- Nginx Reverse Proxy (HTTPS) ---
  nginx:
    build:
      context: .
      dockerfile: services/nginx/Dockerfile
      args:
        NGINX_HOST: ${NGINX_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
      monitoring:
        condition: service_healthy
    networks:
      - titanic-net

volumes:
  postgres-data:
  minio-data:
  model-data:
  reports-data:

networks:
  titanic-net:
    driver: bridge
